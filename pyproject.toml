[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyocera-monitor"
version = "0.2.1"
description = "Linux client tool for Kyocera printers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]
authors = [{ name = "screw-up" }]

[project.urls]
Homepage = "https://github.com/yuannancheng/kyocera-client-tool-for-linux"

[project.scripts]
kyocera-monitor = "kyocera_monitor.cli:main"
kyocera-gui = "kyocera_monitor.gui:main"
kyocera-kmscn-probe = "kyocera_monitor.kmscn:main"

[tool.setuptools]
packages = ["kyocera_monitor"]
